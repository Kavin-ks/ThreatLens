services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: threatlens
      POSTGRES_PASSWORD: threatlens_dev
      POSTGRES_DB: threatlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data_dev:
